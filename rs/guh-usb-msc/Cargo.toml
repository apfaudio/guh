[package]
name = "guh-usb-msc"
version = "0.0.0"
edition = "2021"
categories = ["embedded", "hardware-support", "no-std"]
description = "HAL for the guh USB Mass Storage Class DMA peripheral."

[lib]
test = true
bench = false

[dependencies]
guh-dma = { path = "../guh-dma" }
critical-section = "1"
log = "0.4.*"
fatfs = { git = "https://github.com/vk2seb/rust-fatfs.git", branch = "seb/dma-geo", default-features = false, optional = true }

[features]
default = []
# fatfs block-device adapter over the UsbMsc trait (mount/dir-scan slow path)
# and the FAT chain-following ring streamer (hot path).
fatfs = ["dep:fatfs"]
